name: Build and deploy docs on push

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

# Pages allows one deployment at a time: queue a push's deploy behind the
# one in progress instead of failing it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/docs.yaml
    with:
      tag: ${{ github.ref }}
