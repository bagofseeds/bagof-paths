[project]
name = "bagof-paths"
authors = [
    {name = "Yael Balbastre", email = "yael.balbastre@gmail.com"},
]
maintainers = [
    {name = "Yael Balbastre", email = "yael.balbastre@gmail.com"},
]
description = "A uniform pathlib-style API over pathlib, UPath, and cloud paths."
readme = "README.md"
license = {text = "MIT"}
keywords = ["bagof", "paths", "pathlib", "upath", "fsspec", "cloudpathlib", "python"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dynamic = ["version"]
requires-python = ">=3.8"
dependencies = [
    "typing_extensions>=4.13",
]

[project.urls]
Homepage = "https://github.com/bagofseeds/bagof-paths"
Documentation = "https://github.com/bagofseeds/bagof-paths#readme"
Issues = "https://github.com/bagofseeds/bagof-paths/issues"
Repository = "https://github.com/bagofseeds/bagof-paths"

[project.optional-dependencies]
# universal-pathlib and cloudpathlib require Python >= 3.9; the core package
# and its 3.8 CI leg stay dependency-free (they wrap stdlib pathlib).
upath = ["universal-pathlib"]
cloud = ["cloudpathlib"]
test = [
    "pytest>=7",
    # The driver adapters are exercised against the real backends where the
    # interpreter supports them; the 3.8 leg stays core-only by the marker.
    "universal-pathlib; python_version >= '3.9'",
    "cloudpathlib; python_version >= '3.9'",
    "anyio; python_version >= '3.9'",
]

[build-system]
requires = [
    "setuptools>=59.0",
    "wheel>=0.45.1",
    "versioningit>=1.0",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
# Every pattern must name a file at the repository root: a subdirectory
# pattern is accepted here and then silently dropped by setuptools < 77, so
# the file never reaches the wheel. tests/test_licensing.py enforces this.
license-files = ["LICENSE", "LICENSE-PSF-2.0.txt", "NOTICE.md"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["bagof*"]
namespaces = true

[tool.versioningit]
default-version = "0+unknown"

[tool.versioningit.vcs]
default-tag = "0.1"

[tool.versioningit.format]
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.versioningit.write]
file = "src/bagof/paths/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
target-version = "py38"

[tool.ruff.lint]
select = ["ANN", "B", "E", "F", "I", "UP", "W"]
ignore = [
    "ANN002",   # Do not type *args
    "ANN003",   # Do not type *kwargs
    "ANN401",   # Allow typing with Any
    # pyupgrade rules whose fixes break Python 3.8 (the supported floor)
    "UP006",    # list[...] annotations need 3.9 at runtime
    "UP007",    # X | Y unions need 3.10
    "UP035",    # deprecated typing import (typing_extensions is intentional)
    "UP045",    # X | None optionals need 3.10
]

[tool.codespell]
check-filenames = true
skip = ".git,*.egg-info,build,dist,*.pdf,*.svg"
